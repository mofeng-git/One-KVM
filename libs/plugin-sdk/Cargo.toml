[package]
name = "one-kvm-plugin-sdk"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[features]
embedded = ["runtime", "dep:tempfile", "dep:libc", "dep:windows-sys"]
runtime = ["dep:anyhow", "dep:axum", "dep:futures", "dep:reqwest", "dep:socket2", "dep:tokio", "dep:thiserror", "dep:tracing-subscriber"]

[dependencies]
anyhow = { version = "1", optional = true }
axum = { version = "0.8", optional = true }
bytes = "1"
futures = { version = "0.3", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"], optional = true }
tracing-subscriber = { version = "0.3", optional = true }
typeshare = "1"
socket2 = { version = "0.6", optional = true }
thiserror = { version = "2", optional = true }

tempfile = { version = "3", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
rtp = "0.17"
