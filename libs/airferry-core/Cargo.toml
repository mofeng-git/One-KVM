[package]
name = "one-kvm-airferry-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Built-in optical file reception for One-KVM"

[features]
default = []

[dependencies]
anyhow = "1"
bytes = "1"
crc32fast = "1"
serde_json = "1"
sha2 = "0.10"
# Force bundled XZ and expose its native archive path to build.rs on musl.
lzma-sys = { version = "0.1", features = ["static"] }
tokio = { version = "1", features = ["sync"] }
transfer-engine = { path = "vendor/transfer-engine" }
qr-protocol = { path = "vendor/qr-protocol" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[build-dependencies]
cmake = "0.1"
pkg-config = "0.3"

[dev-dependencies]
transfer-engine = { path = "vendor/transfer-engine", features = ["sender"] }
tokio = { version = "1", features = ["macros", "rt", "time"] }

[patch.crates-io]
raptorq = { path = "vendor/raptorq" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
