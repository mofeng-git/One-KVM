# Native One-KVM subset of raptorq 2.0.1; see ../../PATCHES.md (raptorq section).

[package]
edition = "2024"
name = "raptorq"
version = "2.0.1"
authors = ["Christopher Berner <christopherberner@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "RaptorQ (RFC6330)"
homepage = "https://github.com/cberner/raptorq"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/cberner/raptorq"

[features]
default = ["std"]
serde_support = [
    "serde",
    "std",
]
std = []

[lib]
name = "raptorq"
crate-type = ["lib"]
path = "src/lib.rs"

[dependencies.serde]
version = "1.0.102"
features = [
    "std",
    "derive",
]
optional = true

[dev-dependencies.primal]
version = "0.3"

[dev-dependencies.rand]
version = "0.9"

[dev-dependencies.threadpool]
version = "1.7"
