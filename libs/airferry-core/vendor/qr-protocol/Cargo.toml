[package]
name = "qr-protocol"
version = "1.2.8"
edition = "2021"
license = "MIT"
description = "AirFerry wire protocol for native reception"

[dependencies]
raptorq-core = { git = "https://github.com/UR-SillyB/AirFerry", rev = "8a72ab86dee9d8f19b74bfec56c270101c5980ba" }
crc32fast = "1.4"
sha2 = "0.10"
thiserror = "1"
serde = { version = "1", features = ["derive"], optional = true }
zstd = "0.13"
xz2 = "0.1"

[features]
default = []
serde = ["dep:serde", "raptorq-core/serde"]
