[package]
name = "one-kvm"
version = "0.2.9"
edition = "2021"
authors = ["SilentWind"]
description = "A open and lightweight IP-KVM solution written in Rust"
license = "AGPL-3.0-only"
repository = "https://github.com/mofeng-git/One-KVM"
keywords = ["kvm", "ipkvm", "remote-management", "embedded"]
categories = ["embedded", "network-programming"]

[features]
default = ["airferry", "rustdesk", "easytier", "vnc", "rtsp", "redfish", "mcp", "terminal", "gostc", "easyfrp", "frpc"]
airferry = ["dep:one-kvm-airferry-core"]
rustdesk = ["dep:protobuf", "dep:protobuf-codegen", "dep:sodiumoxide"]
easytier = []
vnc = ["dep:des"]
rtsp = ["dep:rtsp-types", "dep:sdp-types"]
redfish = []
mcp = ["dep:rmcp"]
terminal = ["dep:tokio-tungstenite"]
gostc = []
easyfrp = []
frpc = []
rkmpp = ["hwcodec/rkmpp"]

[dependencies]
one-kvm-airferry-core = { path = "libs/airferry-core", optional = true }
# Async runtime
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }

# Web framework
axum = { version = "0.8", features = ["ws", "multipart", "tokio"] }
axum-extra = { version = "0.12", features = ["cookie"] }
tower-http = { version = "0.6", features = ["cors", "trace", "set-header", "limit"] }

rmcp = { optional = true, version = "3.5.1", default-features = false, features = ["server", "macros", "schemars", "transport-streamable-http-server"] }

# Database - Use bundled SQLite for static linking
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
toml_edit = { version = "0.25" }

# Logging
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "tracing-log"] }

# Error handling
thiserror = { version = "2" }
anyhow = { version = "1" }

# Authentication
argon2 = { version = "0.5" }
rand = { version = "0.10" }
totp-rs = { version = "5.7", features = ["gen_secret", "otpauth", "zeroize"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
base64 = { version = "0.22" }
tempfile = { version = "3" }

# HTTP client (for URL downloads)
reqwest = { version = "0.13", features = ["stream", "native-tls-vendored", "json"], default-features = false }
urlencoding = { version = "2" }

# Static file embedding
rust-embed = { version = "8", features = ["compression", "debug-embed"] }
mime_guess = { version = "2" }

# TLS/HTTPS
openssl = { version = "0.10", features = ["vendored"] }
rcgen = { version = "0.14" }
axum-server = { version = "0.8", features = ["tls-openssl"] }

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Time (cookie max_age + RFC3339 timestamps)
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }

# Bytes handling
bytes = { version = "1" }
bytemuck = { version = "1.24" }

# Frame deduplication (hash-based comparison)
xxhash-rust = { version = "0.8", features = ["xxh64"] }

# Async channels
async-stream = { version = "0.3" }
futures = { version = "0.3" }

# WebSocket client (for ttyd proxy)
tokio-tungstenite = { optional = true, version = "0.29" }

# High-performance synchronization
parking_lot = { version = "0.12" }
arc-swap = { version = "1.8" }

# WebRTC
webrtc = { version = "0.17", features = ["vendored-openssl"] }
rtp = { version = "0.17" }
rtsp-types = { optional = true, version = "0.1" }
sdp-types = { optional = true, version = "0.1" }

# HID (serial port for CH9329)
serialport = { version = "4" }
async-trait = { version = "0.1" }
libc = { version = "0.2" }

# Ventoy bootable image support
ventoy-img = { path = "libs/ventoy-img-rs" }

# RustDesk protocol support
protobuf = { version = "3.7", features = ["with-bytes"], optional = true }
sodiumoxide = { version = "0.2", optional = true }
des = { optional = true, version = "0.9" }
# TypeScript type generation
typeshare = { version = "1.0" }

[target.'cfg(any(target_os = "linux", windows))'.dependencies]
# Video encoding/decoding (FFmpeg/libjpeg-turbo/libyuv; available on Windows and Linux)
hwcodec = { path = "libs/hwcodec", features = ["bytes"] }
libyuv = { path = "res/vcpkg/libyuv" }
turbojpeg = { version = "1.3" }
# Note: audiopus links to libopus.so (unavoidable for audio support)
audiopus = { version = "0.2" }

[target.'cfg(target_os = "linux")'.dependencies]
one-kvm-bluetooth-hid = { path = "libs/bluetooth-hid" }

# Utilities
nix = { version = "0.31", default-features = false, features = ["fs", "socket", "net", "hostname", "poll"] }

# Video capture (V4L2)
v4l2r = { path = "libs/v4l2r" }

# Audio (ALSA capture)
alsa = { version = "0.12.1" }

# ATX (GPIO control)
gpio-cdev = { version = "0.6" }

[target.'cfg(windows)'.dependencies]
# Pin upstream's ALSA 0.12 update until a compatible CPAL release is available.
# Cargo resolves native `links` dependencies across target platforms.
cpal = { git = "https://github.com/RustAudio/cpal", rev = "8e836f5b926283fd4c455092c4eef35c5a0da9e0", default-features = false }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[build-dependencies]
protobuf-codegen = { version = "3.7", optional = true }

[patch.crates-io]
dtls = { path = "libs/dtls" }
# Native AirFerry uses the ARM32 scalar fix and the pinned upstream QR protocol.
raptorq = { path = "libs/airferry-core/vendor/raptorq" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Static linking profile for musl targets
[profile.release-static]
inherits = "release"
opt-level = "z"  # Optimize for size
