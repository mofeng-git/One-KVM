[package]
name = "one-kvm-plugin-vnc"
version = "0.2.9"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
one-kvm-plugin-sdk = { path = "../../libs/plugin-sdk", features = ["runtime"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
bytes = "1"
des = "0.9"
rand = "0.10"
