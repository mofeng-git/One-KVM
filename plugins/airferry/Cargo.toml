[package]
name = "one-kvm-plugin-airferry"
version = "0.2.9"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
one-kvm-plugin-sdk = { path = "../../libs/plugin-sdk", features = ["runtime"] }
anyhow = "1"
