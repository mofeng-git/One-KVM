[package]
name = "one-kvm-plugin-rustdesk"
version = "0.2.9"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
one-kvm-plugin-sdk = { path = "../../libs/plugin-sdk", features = ["runtime"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
base64 = "0.22"
bytes = "1"
parking_lot = "0.12"
openssl = { version = "0.10", features = ["vendored"] }
protobuf = { version = "3.7", features = ["with-bytes"] }
rand = "0.10"
sodiumoxide = "0.2"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
protobuf-codegen = "3.7"
